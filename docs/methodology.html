  <script>

      {type:"prose", id:"about", title:{en:"About & methodology", zh:"關於與方法論"}, blocks:[
        {type:"p", text:{en:"All-VC-Info is an open, unofficial directory of investment organizations across nine regions: Taiwan, the United States, Japan, Europe, South Korea, Southeast Asia, Israel, India and Canada. It covers twelve organization types — VC firms, accelerators, incubators, corporate VCs, angel networks and syndicates, government programs, venture studios, micro-VCs, family offices, growth-equity and equity-crowdfunding.",
                          zh:"All-VC-Info 是一份開放、非官方的投資機構名錄,橫跨九大地區:台灣、美國、日本、歐洲、南韓、東南亞、以色列、印度、加拿大。涵蓋十二種機構類型 — 創投、加速器、育成中心、企業創投、天使網絡與 syndicate、政府計畫、創業工作室、Micro-VC、家族辦公室、成長期股權與股權群募。"}},
        {type:"h3", text:{en:"How it was built", zh:"怎麼做的"}},
        {type:"p", text:{en:"The dataset was assembled by hundreds of parallel research agents. Each region was sliced into 24–31 segments (by stage, sector, type and geography), and one agent researched each slice with live web search, writing structured, sourced records. A deterministic Python pipeline then deduped the slices, validated every record against a JSON Schema, and merged them — keeping the highest-confidence value and unioning sources on any duplicate.",
                          zh:"這份資料由數百個平行研究 agent 組裝而成。每個地區切成 24–31 個切片(依階段、產業、類型與地理),每個 agent 用即時網路搜尋研究一塊切片,產出結構化且附來源的資料。接著用一支確定性的 Python pipeline 去重、以 JSON Schema 驗證每筆、再合併 — 重複者保留最高信心值並聯集來源。"}},
        {type:"h3", text:{en:"Provenance & confidence", zh:"溯源與信心度"}},
        {type:"p", text:{en:"Every quantitative claim — fund size, check size, equity %, acceptance rate, founding year — is tied to a source with a verbatim quote; figures that could not be verified are left blank rather than guessed. Each entry carries a confidence rating: high (official / primary source), medium (reputable secondary), or low (a single weak or dated source). Open any organization to read its sources.",
                          zh:"每個量化數字 — 基金規模、單筆金額、股權 %、錄取率、成立年 — 都綁定一個附原文 quote 的來源;查不到的數字寧可留白,不猜。每筆並標示信心度:高(官方/一手)、中(可靠二手)、低(單一弱來源或過時)。點開任一機構即可閱讀其來源。"}},
        {type:"h3", text:{en:"Disclaimer", zh:"免責"}},
        {type:"p", html:true, text:{en:"This is an unofficial research compilation for reference only. Figures may be out of date — verify against each entry's sources before citing. Code and data live on <a href='https://github.com/tingwei161803/all-vc-info' target='_blank' rel='noopener'>GitHub: tingwei161803/all-vc-info →</a>",
                          zh:"非官方整理,僅供參考。數字可能過時,引用前請依各筆來源自行查證。程式碼與資料在 <a href='https://github.com/tingwei161803/all-vc-info' target='_blank' rel='noopener'>GitHub: tingwei161803/all-vc-info →</a>"}}
      ]},
      {type:"provenance", id:"prov", title:{en:"Data provenance in numbers", zh:"資料溯源(數字)"}, sub:{en:"How well-sourced the dataset is.", zh:"這份資料的來源紮實程度。"}},

      {type:"glossary", id:"gloss-sectors", kind:"sectors", title:{en:"Glossary · sectors", zh:"名詞表 · 產業"}}
